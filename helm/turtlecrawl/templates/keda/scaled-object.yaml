{{- if .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .Values.keda.scaledObject.name }}
  namespace: {{ include "turtlecrawl.namespace" . }}
  labels:
    app: sample-app
    {{- include "turtlecrawl.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sample-app
  pollingInterval:  {{ .Values.keda.scaledObject.pollingInterval }}
  cooldownPeriod:   {{ .Values.keda.scaledObject.cooldownPeriod }}
  minReplicaCount:  {{ .Values.keda.scaledObject.minReplicas }}
  maxReplicaCount:  {{ .Values.keda.scaledObject.maxReplicas }}
  triggers:
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: {{ include "turtlecrawl.nats.monitoringEndpoint" . }}
        account: "$G"
        stream:   {{ .Values.keda.scaledObject.stream | quote }}
        consumer: {{ .Values.keda.scaledObject.consumer | quote }}
        lagThreshold: {{ .Values.keda.scaledObject.lagThreshold | quote }}
        activationLagThreshold: {{ .Values.keda.scaledObject.activationLagThreshold | quote }}
  advanced:
    restoreToOriginalReplicaCount: false
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 4
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 120
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
{{- end }}
