{{- if .Values.rbac.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: turtlecrawl-agent
  namespace: {{ include "turtlecrawl.namespace" . }}
  labels:
    {{- include "turtlecrawl.labels" . | nindent 4 }}
  annotations:
    # Workload Identity — lets the agent Pod call GCP APIs without a key file
    iam.gke.io/gcp-service-account: {{ include "turtlecrawl.gcpServiceAccountEmail" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: turtlecrawl-scaler
  labels:
    {{- include "turtlecrawl.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects", "scaledjobs"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: turtlecrawl-scaler-binding
  labels:
    {{- include "turtlecrawl.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: turtlecrawl-agent
    namespace: {{ include "turtlecrawl.namespace" . }}
roleRef:
  kind: ClusterRole
  name: turtlecrawl-scaler
  apiGroup: rbac.authorization.k8s.io
{{- end }}
