apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: turtlecrawl
  labels:
    app: sample-app
    app.kubernetes.io/part-of: turtlecrawl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
      annotations:
        # Prometheus scrape annotation — kube-prometheus-stack auto-discovers this
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: sample-app
          image: REGISTRY/sample-app:latest  # replaced by CI/CD
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: NATS_URL
              value: "nats://nats.turtlecrawl.svc.cluster.local:4222"
            - name: NATS_ENABLED
              value: "true"
            - name: SNAPSHOT_INTERVAL_SECS
              value: "30"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          # Graceful drain — give in-flight requests time to complete
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]
      terminationGracePeriodSeconds: 60
